name: Linkwell CI

on:
  push:
    branches:
      - main
      - feature/neon-auth-migration
  pull_request:
    branches:
      - main
      - feature/neon-auth-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkwell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
